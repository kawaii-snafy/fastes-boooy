# FastesBoooy CI: lint (luacheck with the generated Forever std), route validator, busted specs,
# route simulation (every route) and the "player ahead of the route" runs (SYNC_ROUTES of the
# Makefile), generated-data and validation-report freshness, packaging.
#
# One job. The stages below are the prerequisites of `make check`, run one by one so that the log
# shows the wall time of each (tests/spec/build_spec.lua checks that none is missing). Expected on a
# hosted runner with 4 vCPUs and the 28 routes of FastesBoooy_Guides (docs/dev/PLAN.md A.7):
#   setup 1.5 min; lint + validate + fixtures 0.3 min; busted 1.7 min; simulate 3.0 min;
#   simulate-sync 3.2 min; freshness + package 0.1 min -- about 10 min in all.
# simulate and simulate-sync run JOBS simulations at a time (default: the number of CPUs).
# If the runner is slower than that: first run the busted spec files in parallel, then drop
# `--ahead 10` and `--level-plus 2` for all but one route of SYNC_ROUTES. Every route gets the
# sync runs in .github/workflows/nightly.yml.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1, LuaRocks, luacheck, busted
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1 liblua5.1-0-dev luarocks zip
          sudo luarocks --lua-version=5.1 install luacheck 1.1.2
          sudo luarocks --lua-version=5.1 install busted 2.2.0
          lua5.1 -v
          luacheck --version
          busted --version
          echo "CPUs: $(nproc)"

      - name: Lint (luacheck)
        run: make lint

      - name: Validate the routes and the fixtures, harness fixture
        run: make validate validate-fixtures harness-fixtures

      - name: Specs (busted)
        run: make test

      - name: Simulate every route (in parallel)
        run: make simulate simulate-fixtures

      - name: Simulate "player ahead of the route" (SYNC_ROUTES, in parallel)
        run: make simulate-sync

      - name: Generated route data is up to date
        run: make routedata-check

      # `make report` fails when the validator wrote no report (a crash of the report generator;
      # routes with errors do not fail it), and leaves the committed file untouched in that case:
      # a stale docs/VALIDATION.md never passes as a fresh one.
      - name: Validation report is up to date
        run: |
          make report
          test -f docs/VALIDATION.md
          git diff --exit-code -- docs/VALIDATION.md || {
            echo "docs/VALIDATION.md is stale: run 'make report' and commit the result"; exit 1; }

      - name: Package addons
        run: make package

      - uses: actions/upload-artifact@v4
        with:
          name: addons
          path: |
            dist/*.zip
            docs/VALIDATION.md
          if-no-files-found: warn
