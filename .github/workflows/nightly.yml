# AdventureAtlas nightly: the "player ahead of the route" runs for EVERY route (make simulate-sync-full).
#
# CI (ci.yml) runs them for SYNC_ROUTES only: one route per race with different classes. That subset
# is sound for a push -- from the merge point on all routes share the same segments -- and this job
# covers the rest: every start zone with every class file. With the 28 routes of AdventureAtlas_Guides
# it is 28 x 8 runs, about 18 min on 4 vCPUs (docs/dev/PLAN.md A.7).
name: Nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulate-sync-full:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua 5.1
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lua5.1
          lua5.1 -v
          echo "CPUs: $(nproc)"

      - name: Simulate "player ahead of the route" for every route (in parallel)
        run: make simulate-sync-full
